name: Update The Mamdani File

on:
  push:
    branches: [main]          # rebuild whenever you push new code
  schedule:
    # Twice-hourly PROBE at off-peak minutes. Top-of-hour crons ("0 * * *") sit in
    # GitHub's most congested queue and get silently skipped under load; :07/:37 are
    # far quieter, and two chances per hour ride out GitHub's scheduler flaking on
    # newer repos (observed 2026-07-27: the single :37 cron went silent for 13 hours).
    # A probe only triggers a real (Claude-calling) rebuild when the live page is stale
    # -- see the freshness guard in the "check" job -- so content still refreshes about
    # every 4 hours and API cost stays flat; a fresh-page probe is a 9-second no-op.
    - cron: "7,37 * * * *"
  workflow_dispatch: {}       # allow manual runs from the Actions tab

# Least-privilege token; Pages deploy needs pages + id-token; the keepalive step
# below needs actions: write to re-enable this workflow.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

# Serialize Pages work; do NOT cancel an in-progress build (a new probe must never
# kill a real rebuild that is mid-flight).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Decide whether a rebuild is actually needed. On push / manual runs, always rebuild.
  # On the hourly schedule, rebuild only when the live page is older than the threshold.
  check:
    runs-on: ubuntu-latest
    outputs:
      stale: ${{ steps.guard.outputs.stale }}
    steps:
      # GitHub silently disables a scheduled workflow after 60 days with no commits to
      # the repo. Re-enabling the workflow through the API resets that 60-day clock,
      # so do it on every scheduled probe. No commit needed.
      - name: Keep the schedule alive
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable" \
          && echo "Inactivity clock reset." || echo "Keepalive call failed (non-fatal)."
      - id: guard
        env:
          MAX_AGE_SECONDS: "13800"   # 3h50m: a ~4h-old page rebuilds; a fresher one is skipped
          LIVE_URL: "https://gfilitti-ai.github.io/mamdani-dsa-tracker/index.html"
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Event '${{ github.event_name }}': forcing a rebuild."
            echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          html="$(curl -s --max-time 20 "$LIVE_URL")"
          epoch="$(printf '%s' "$html" | grep -oE 'build_epoch=[0-9]+' | head -1 | cut -d= -f2)"
          if [ -z "$epoch" ]; then
            echo "No build_epoch on the live page; rebuilding to be safe."
            echo "stale=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          now="$(date +%s)"
          age=$(( now - epoch ))
          echo "Live page age: ${age}s (threshold ${MAX_AGE_SECONDS}s)."
          if [ "$age" -ge "$MAX_AGE_SECONDS" ]; then
            echo "Stale -> rebuild."
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "Fresh -> skip (no Claude call, no deploy)."
            echo "stale=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Generate page
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python generate.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: [check, build]
    if: needs.check.outputs.stale == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
